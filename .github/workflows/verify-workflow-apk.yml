name: Verify immutable workflow APK
on:
  push:
    branches: [verify/workflow-apk, verify/auto-audio-apk, verify/editor-apk, verify/creator-apk]
  workflow_dispatch:
jobs:
  release-update:
    name: Actual signed release complete acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cancel superseded creator verification runs
        uses: actions/github-script@v7
        with:
          script: |
            for(const run_id of [43141489126,43141228935]) {
              const {data}=await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id});
              if(data.status!=='completed') await github.rest.actions.cancelWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id});
            }
      - name: Wait for immutable Build 143 artifact
        uses: actions/github-script@v7
        with:
          script: |
            for(let attempt=0;attempt<40;attempt++){
              const request={owner:context.repo.owner,repo:context.repo.repo,run_id:43140879228};
              const {data}=await github.rest.actions.listWorkflowRunArtifacts(request);
              if(data.artifacts.some(a=>a.name==='ClipForge-AI-Mobile-release')) return;
              const {data:run}=await github.rest.actions.getWorkflowRun(request);
              if(run.status==='completed') throw new Error('Build 143 finished without an installer artifact');
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            throw new Error('Timed out waiting for the immutable installer');
      - uses: actions/download-artifact@v4
        with:
          run-id: 43140879228
          name: ClipForge-AI-Mobile-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/release-under-test
      - uses: actions/download-artifact@v4
        with:
          run-id: 43140879228
          name: ClipForge-baseline94-compatibility-test-only
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/baseline94
      - name: Verify immutable Build 143 identity and checksum
        shell: python
        run: |
          import hashlib,json
          from pathlib import Path
          record=json.loads(Path('build/release-under-test/release-manifest.json').read_text())
          assert record['commit']=='7d50703bcf59442949e1d3a64a53a445f238e656'
          assert record['version']=='1.8.0' and record['version_code']==143 and not record['debuggable']
          apk=Path('build/release-under-test/app/build/outputs/apk/release/app-release.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==record['apk_sha256']
          print('Exact Build 143 installer confirmed:',record['apk_sha256'])
      - name: Cache verified public speech model
        uses: actions/cache@v4
        with:
          path: .ci-models/ggml-tiny.bin
          key: whisper-tiny-be07e048e1e599ad-v1
      - name: Prepare synthetic media and screenshot tools
        run: |
          source .github/scripts/prepare-media-tools.sh
          bash .github/scripts/media-fixtures.sh
          mkdir -p .ci-models
          if [ ! -s .ci-models/ggml-tiny.bin ]; then
            curl --fail --location --retry 3 -o .ci-models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          fi
          printf '%s  %s\n' be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21 .ci-models/ggml-tiny.bin | sha256sum --check
          curl --fail --location --retry 3 -o .ci-models/jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.7.6/samples/jfk.wav
          ffmpeg -v error -y -f lavfi -i 'testsrc2=size=320x180:rate=24' -i .ci-models/jfk.wav -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac app/src/androidTest/assets/public-speech.mp4
      - name: Cache Android test system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-30/default/x86_64
          key: android-api30-default-x86_64-image-v1
      - name: Reserve disk space for Android emulator userdata
        run: |
          df -h .
          if [ "$(df --output=avail -B1 . | tail -1)" -lt 12000000000 ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc
          fi
          df -h .
          test "$(df --output=avail -B1 . | tail -1)" -ge 10000000000
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, update and exercise the actual signed release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/scripts/release-update-smoke.py --baseline build/baseline94/baseline94-test-only.apk --release build/release-under-test/app/build/outputs/apk/release/app-release.apk --seed build/release-under-test/app/build/outputs/release-update-seed --video app/src/androidTest/assets/landscape.mp4 --speech app/src/androidTest/assets/public-speech.mp4 --model .ci-models/ggml-tiny.bin --phase full
      - name: Upload actual release acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-signed-release-acceptance
          path: build/release-acceptance/
          if-no-files-found: warn

  media-device:
    name: Android media, foreground export cancellation and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install synthetic fixture generator
        run: |
          source .github/scripts/prepare-media-tools.sh
      - name: Prepare test-only signing identity and fixtures
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/clipforge-development.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ClipForge CI Test" -noprompt
          bash .github/scripts/media-fixtures.sh
      - name: Cache Android test system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-30/default/x86_64
          key: android-api30-default-x86_64-image-v1
      - name: Prepare Android test image with bounded retries
        shell: bash
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$sdkmanager_bin" "system-images;android-30;default;x86_64"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: Reserve disk space for Android emulator userdata
        run: |
          df -h .
          if [ "$(df --output=avail -B1 . | tail -1)" -lt 12000000000 ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc
          fi
          df -h .
          test "$(df --output=avail -B1 . | tail -1)" -ge 10000000000
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real Android media pipeline with synthetic fixtures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedDebugAndroidTest -PmediaDeviceTests=true --no-daemon --console=plain --warning-mode=none
      - name: Upload device integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-android-media-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
