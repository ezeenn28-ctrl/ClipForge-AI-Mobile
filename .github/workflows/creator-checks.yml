name: Creator tools checks
on:
  push:
    branches: [feature/creator-tools]
  workflow_dispatch:
concurrency:
  group: clipforge-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CLIPFORGE_ROBOLECTRIC_SDK: ${{ github.workspace }}/.ci-robolectric
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi
      - name: Cache pinned Robolectric SDK
        uses: actions/cache@v4
        with:
          path: .ci-robolectric
          key: robolectric-android15-12650502-i7-v1
      - name: Verify offline test SDK
        run: python3 .github/scripts/prepare-robolectric.py
      - name: Validate source and run available unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest -PmediaDeviceTests=true --no-daemon --console=plain --warning-mode=none 2>&1 | tee android-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Creator-unit-results
          path: |
            app/build/test-results/
            android-test.log
