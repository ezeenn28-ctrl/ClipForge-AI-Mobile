name: Deliver verified private APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deliver-release.yml']
  workflow_dispatch:
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require private repository and completed verification
        shell: bash
        run: |
          gh api "repos/$GH_REPO" > repository.json
          python3 -c 'import json; assert json.load(open("repository.json"))["private"], "This delivery is private-only"'
          gh api "repos/$GH_REPO/actions/runs/42769587936/jobs" > baseline-jobs.json
          gh api "repos/$GH_REPO/actions/runs/42772568687/jobs" > media-jobs.json
          python3 - <<'PY'
          import json
          expected = {
            "baseline-jobs.json": ["build", "Native Whisper integration and endurance"],
            "media-jobs.json": ["Android decoder and export integration"],
          }
          for path, names in expected.items():
              jobs = json.load(open(path))["jobs"]
              for name in names:
                  matches = [j for j in jobs if j["name"] == name]
                  assert len(matches) == 1 and matches[0]["conclusion"] == "success", (path, name)
          print("All required real verification jobs passed")
          PY
      - name: Retrieve completed exact-APK workflow evidence
        uses: actions/download-artifact@v4
        with:
          name: ClipForge-signed-release-acceptance
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42775151387
          path: acceptance
      - name: Require all nine recorded update and export checks
        run: |
          python3 - <<'PY'
          import json
          result = json.load(open("acceptance/result.json"))
          assert len(result["checks"]) == 9, result
          assert result["checks"][-1] == "Process restart restores project and clears export approval"
          assert "Actual release approval/export preserves saved speed, captions, framing and audio in Gallery MP4" in result["checks"]
          print("Nine completed exact-APK checks verified. Later picker automation remains separate.")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ClipForge-AI-Mobile-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42769587936
          path: verified
      - name: Verify immutable APK and prepare owner installer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, zipfile
          apk = Path("verified/app/build/outputs/apk/release/app-release.apk")
          manifest = json.load(open("verified/release-manifest.json"))
          expected = "01d88ee76d8109c37ea3cda8462c594dfb873bda5e8fe18f8a1a35e606cdc69a"
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == expected == manifest["apk_sha256"]
          assert manifest["version_code"] == 97 and manifest["version"] == "1.0.1"
          assert manifest["debuggable"] is False
          assert manifest["commit"] == "496792695211b64ab7e11ce3d82bd0d87306bf1b"
          assert manifest["signing_certificate_sha256"] == "ea9f20de77e24660999aaae941f66029c76ffe94170e33dfc4cfb03ce13d8ea6"
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for abi in ("arm64-v8a", "x86_64"):
                  assert "lib/" + abi + "/libclipforge_whisper.so" in z.namelist()
          shutil.copyfile(apk, "ClipForge-AI-1.0.1-universal.apk")
          Path("SHA256SUMS.txt").write_text(expected + "  ClipForge-AI-1.0.1-universal.apk\n")
          PY
          cat > release-notes.md <<'NOTES'
          Personal Android v1.0.1, Build 97, final phone-test candidate. Install as an update without uninstalling to retain projects and media access.

          Passed: 116 host/unit tests and 9 Android API 30 media tests, zero failures/errors/skips. Real native inference completed 240 repeated/padded public-speech windows (two-hour-equivalent synthetic workload) in 765.529 seconds on Linux CI; this is not a phone benchmark.

          Nine completed checks on this exact signed APK cover the compatibility baseline, signed update, project/campaign retention, moving preview, review gate, approved MP4 duration/framing/caption/highlight/audio and Gallery publication, share sheet, and restart with approval cleared. They were recorded in #103 before a later system-picker automation failure. The failed overall job is not presented as fully passed.

          Follow-up system-picker/packaged-transcription and clean-import automation is separate. See docs/FINAL_RELEASE.md for the latest actual results and remaining checks. Physical Nubia import/transcription, heat/battery behavior and broad Taglish accuracy require owner testing.

          APK source: 496792695211b64ab7e11ce3d82bd0d87306bf1b. Build/unit/native: #97. Media retry: #100. Exact-APK update/export evidence: #103. The pinned Build 94 update baseline was rebuilt for x86 compatibility, not the original ARM64 binary. No user media was used or automatically exported.

          This is the supported personal v1 scope. Advanced tracking, background removal, overlapping video layers/cross-dissolves and speed ramps remain future work. No cloud provider is included.
          NOTES
      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-AI-1.0.1-universal
          path: |
            ClipForge-AI-1.0.1-universal.apk
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish installer to the private owner repository
        run: |
          gh release create v1.0.1 ClipForge-AI-1.0.1-universal.apk SHA256SUMS.txt --target 496792695211b64ab7e11ce3d82bd0d87306bf1b --prerelease --title "ClipForge AI 1.0.1 - final phone-test candidate" --notes-file release-notes.md
