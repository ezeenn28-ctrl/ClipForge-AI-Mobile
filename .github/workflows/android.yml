name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: clipforge-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CLIPFORGE_ROBOLECTRIC_SDK: ${{ github.workspace }}/.ci-robolectric
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore development signing identity
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/clipforge-development.keystore
            ~/.android/clipforge-debug-cert.sha256
          key: clipforge-debug-signing-${{ github.repository_id }}-v2
      - name: Require original signing identity
        shell: bash
        run: |
          test -s "$HOME/.android/clipforge-development.keystore" || { echo 'Original signing key missing. Restore it from the private owner backup; do not generate a replacement.'; exit 1; }
      - name: Seal original signing-key backup for owner recovery
        run: python3 .github/scripts/seal-signing-backup.py
      - name: Upload encrypted owner recovery envelope
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-owner-encrypted-signing-backup
          path: release-private/ClipForge-signing-backup.cms
          retention-days: 30
          if-no-files-found: error
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi
      - name: Fetch pinned whisper.cpp native inference source
        run: |
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper.cpp
      - name: Cache pinned Robolectric SDK
        uses: actions/cache@v4
        with:
          path: .ci-robolectric
          key: robolectric-android15-12650502-i7-v1
      - name: Verify offline test SDK
        run: python3 .github/scripts/prepare-robolectric.py
      - name: Validate source and run available unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --console=plain --warning-mode=none 2>&1 | tee android-test.log
      - name: Generate baseline-compatible update fixtures
        run: gradle :app:writeReleaseUpgradeSeed --no-daemon --console=plain --warning-mode=none
      - name: Summarize unit test results
        if: always()
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET
          paths = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          counts = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in paths:
              root = ET.parse(path).getroot()
              for key in counts:
                  counts[key] += int(root.get(key, 0))
          summary = f"Unit tests: {counts['tests']} total, {counts['failures']} failures, {counts['errors']} errors, {counts['skipped']} skipped"
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary + '\n')
          if not paths:
              raise SystemExit('No unit test reports found')
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Upload rendered studio previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-studio-previews
          path: app/build/outputs/studio-previews/*.png
          if-no-files-found: warn
      - name: Check out the pinned Build 94 compatibility source
        uses: actions/checkout@v4
        with:
          ref: e95ec581d12810eb248a4f04be31101d9a782af0
          path: build/baseline94-source
      - name: Build a signed x86 baseline from Build 94 source for update testing
        run: |
          GITHUB_RUN_NUMBER=94 gradle -p build/baseline94-source :app:assembleDebug -PmediaDeviceTests=true --no-daemon --console=plain --warning-mode=none
          cp build/baseline94-source/app/build/outputs/apk/debug/app-debug.apk build/baseline94-test-only.apk
      - name: Upload pinned baseline compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-baseline94-compatibility-test-only
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/baseline94-test-only.apk
          retention-days: 7
          if-no-files-found: error
      - name: Build APK with concise diagnostics
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease -PuniversalRelease=true --no-daemon --console=plain --warning-mode=none 2>&1 | tee android-build.log
      - name: Print actionable errors on failure
        if: failure()
        run: |
          echo '### Android build errors' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          grep -E -A 12 '(^e: |^error:|^FAILURE:|^\* What went wrong:|^Execution failed|Could not resolve|Could not find|Unresolved reference|Compilation error|failed to find)' android-test.log android-build.log | tail -120 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-build-log
          path: |
            android-build.log
            android-test.log
          if-no-files-found: ignore
      - name: Verify optimized native inference flags
        if: success()
        shell: python
        run: |
          import glob, json, shlex
          checked = []
          for path in glob.glob('app/.cxx/**/compile_commands.json', recursive=True):
              for entry in json.load(open(path)):
                  source = entry['file'].replace('\\', '/')
                  if source.endswith('/src/whisper.cpp') or source.endswith('/ggml-cpu/ggml-cpu.cpp') or source.endswith('/ggml-cpu/ggml-cpu.c'):
                      args = entry.get('arguments') or shlex.split(entry['command'])
                      levels = [arg for arg in args if arg in ('-O0', '-O1', '-O2', '-O3', '-Os', '-Oz', '-Ofast')]
                      if not levels or levels[-1] not in ('-O3', '-Ofast'):
                          raise SystemExit('Inference is not optimized: ' + source + ' ' + str(levels) + ' command=' + str(args))
                      checked.append(source)
          if not any(path.endswith('/src/whisper.cpp') for path in checked):
              raise SystemExit('No Whisper compile command found')
          if not any('/ggml-cpu/' in path for path in checked):
              raise SystemExit('No CPU kernel compile command found')
          print('Verified optimized Whisper and CPU kernels: ' + str(len(checked)) + ' compile commands')
      - name: Verify release signing identity
        if: success()
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signing-report.txt
          python - <<'PY_SIGNING'
          import os, re
          from pathlib import Path
          text = Path('signing-report.txt').read_text()
          match = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', text)
          if not match:
              raise SystemExit('APK signing fingerprint missing')
          path = Path(os.path.expanduser('~/.android/clipforge-debug-cert.sha256'))
          fingerprint = match.group(1).lower()
          expected = Path('.github/signing/identity.sha256').read_text().strip()
          if fingerprint != expected:
              raise SystemExit('Release signing identity differs from the installed app')
          if path.exists() and path.read_text().strip() != fingerprint:
              raise SystemExit('Cached development signing identity changed')
          path.write_text(fingerprint + '\n')
          print('Release APK signing fingerprint verified')
          PY_SIGNING
      - name: Upload signing report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-signing-report
          path: signing-report.txt
      - name: Verify generated APK
        if: success()
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          ls -lh "$APK"
          echo "### APK verified as a nonempty, valid ZIP archive" >> "$GITHUB_STEP_SUMMARY"
          echo "Path: \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify release manifest and checksums
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk > release-badging.txt
          python3 - <<'PY_RELEASE'
          import hashlib, json, os
          from pathlib import Path
          text = Path('release-badging.txt').read_text()
          if 'application-debuggable' in text:
              raise SystemExit('Release must not be debuggable')
          if "versionName='1.0.2'" not in text:
              raise SystemExit('Unexpected release version')
          apk = Path('app/build/outputs/apk/release/app-release.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          record = dict(version='1.0.2', version_code=int(os.environ['GITHUB_RUN_NUMBER']),
                        commit=os.environ['GITHUB_SHA'], apk_sha256=digest,
                        signing_certificate_sha256=Path('.github/signing/identity.sha256').read_text().strip(),
                        debuggable=False, abi=['arm64-v8a', 'x86_64'])
          Path('release-manifest.json').write_text(json.dumps(record, indent=2) + '\n')
          Path('SHA256SUMS.txt').write_text(digest + '  app-release.apk\n')
          print('Non-debuggable release manifest and SHA-256 verified')
          PY_RELEASE
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-AI-Mobile-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            release-manifest.json
            SHA256SUMS.txt
            app/build/outputs/release-update-seed/
          if-no-files-found: error
  native-smoke:
    name: Native Whisper integration and endurance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache verified public test model
        uses: actions/cache@v4
        with:
          path: .ci-models/ggml-tiny.bin
          key: whisper-tiny-be07e048e1e599ad-v1
      - name: Fetch pinned native source and public speech fixture
        run: git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper.cpp
      - name: Exercise native callbacks and model lifecycle
        shell: bash
        run: |
          set -o pipefail
          CLIPFORGE_NATIVE_STRESS_WINDOWS=240 bash .github/scripts/native-smoke.sh 2>&1 | tee native-smoke.log
      - name: Upload native integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-native-smoke-log
          path: |
            native-smoke.log
            build/native-smoke/endurance-report.json
          if-no-files-found: warn

  media-device:
    name: Android decoder and export integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install synthetic fixture generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Prepare test-only signing identity and fixtures
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/clipforge-development.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ClipForge CI Test" -noprompt
          bash .github/scripts/media-fixtures.sh
      - name: Cache Android test system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-30/default/x86_64
          key: android-api30-default-x86_64-image-v1
      - name: Prepare Android test image with bounded retries
        shell: bash
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$sdkmanager_bin" "system-images;android-30;default;x86_64"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real Android media pipeline with synthetic fixtures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedDebugAndroidTest -PmediaDeviceTests=true --no-daemon --console=plain --warning-mode=none
      - name: Upload device integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-android-media-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn

  release-update:
    name: Actual signed release complete acceptance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: ClipForge-AI-Mobile-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/release-under-test
      - uses: actions/download-artifact@v4
        with:
          name: ClipForge-baseline94-compatibility-test-only
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/baseline94
      - name: Cache verified public speech model
        uses: actions/cache@v4
        with:
          path: .ci-models/ggml-tiny.bin
          key: whisper-tiny-be07e048e1e599ad-v1
      - name: Prepare synthetic media and screenshot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil
          bash .github/scripts/media-fixtures.sh
          mkdir -p .ci-models
          if [ ! -s .ci-models/ggml-tiny.bin ]; then
            curl --fail --location --retry 3 -o .ci-models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          fi
          printf '%s  %s\n' be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21 .ci-models/ggml-tiny.bin | sha256sum --check
          curl --fail --location --retry 3 -o .ci-models/jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.7.6/samples/jfk.wav
          ffmpeg -v error -y -f lavfi -i 'testsrc2=size=320x180:rate=24' -i .ci-models/jfk.wav -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac app/src/androidTest/assets/public-speech.mp4
      - name: Cache Android test system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-30/default/x86_64
          key: android-api30-default-x86_64-image-v1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, update and exercise the actual signed release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/scripts/release-update-smoke.py --baseline build/baseline94/baseline94-test-only.apk --release build/release-under-test/app/build/outputs/apk/release/app-release.apk --seed build/release-under-test/app/build/outputs/release-update-seed --video app/src/androidTest/assets/landscape.mp4 --speech app/src/androidTest/assets/public-speech.mp4 --model .ci-models/ggml-tiny.bin --phase full
      - name: Upload actual release acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-signed-release-acceptance
          path: build/release-acceptance/
          if-no-files-found: warn
