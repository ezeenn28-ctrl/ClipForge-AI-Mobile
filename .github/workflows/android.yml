name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: clipforge-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore development signing identity
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/clipforge-development.keystore
            ~/.android/clipforge-debug-cert.sha256
          key: clipforge-debug-signing-${{ github.repository_id }}-v2
      - name: Prepare explicit development keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/clipforge-development.keystore" ]; then
            test ! -f "$HOME/.android/clipforge-debug-cert.sha256" || { echo 'Cached keystore is missing'; exit 1; }
            keytool -genkeypair -keystore "$HOME/.android/clipforge-development.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ClipForge Development,O=ClipForge,C=PH" -noprompt
          fi
          test -s "$HOME/.android/clipforge-development.keystore"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi
      - name: Fetch pinned whisper.cpp native inference source
        run: |
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper.cpp
      - name: Validate source and run available unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --console=plain --warning-mode=none 2>&1 | tee android-test.log
      - name: Summarize unit test results
        if: always()
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET
          paths = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          counts = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in paths:
              root = ET.parse(path).getroot()
              for key in counts:
                  counts[key] += int(root.get(key, 0))
          summary = f"Unit tests: {counts['tests']} total, {counts['failures']} failures, {counts['errors']} errors, {counts['skipped']} skipped"
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary + '\n')
          if not paths:
              raise SystemExit('No unit test reports found')
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Upload rendered studio previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-studio-previews
          path: app/build/outputs/studio-previews/*.png
          if-no-files-found: warn
      - name: Build APK with concise diagnostics
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --warning-mode=none 2>&1 | tee android-build.log
      - name: Print actionable errors on failure
        if: failure()
        run: |
          echo '### Android build errors' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          grep -E -A 12 '(^e: |^error:|^FAILURE:|^\* What went wrong:|^Execution failed|Could not resolve|Could not find|Unresolved reference|Compilation error|failed to find)' android-test.log android-build.log | tail -120 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-build-log
          path: |
            android-build.log
            android-test.log
          if-no-files-found: ignore
      - name: Verify optimized native inference flags
        if: success()
        shell: python
        run: |
          import glob, json, shlex
          checked = []
          for path in glob.glob('app/.cxx/**/compile_commands.json', recursive=True):
              for entry in json.load(open(path)):
                  source = entry['file'].replace('\\', '/')
                  if source.endswith('/src/whisper.cpp') or source.endswith('/ggml-cpu/ggml-cpu.cpp') or source.endswith('/ggml-cpu/ggml-cpu.c'):
                      args = entry.get('arguments') or shlex.split(entry['command'])
                      levels = [arg for arg in args if arg in ('-O0', '-O1', '-O2', '-O3', '-Os', '-Oz', '-Ofast')]
                      if not levels or levels[-1] not in ('-O3', '-Ofast'):
                          raise SystemExit('Inference is not optimized: ' + source + ' ' + str(levels) + ' command=' + str(args))
                      checked.append(source)
          if not any(path.endswith('/src/whisper.cpp') for path in checked):
              raise SystemExit('No Whisper compile command found')
          if not any('/ggml-cpu/' in path for path in checked):
              raise SystemExit('No CPU kernel compile command found')
          print('Verified optimized Whisper and CPU kernels: ' + str(len(checked)) + ' compile commands')
      - name: Verify development signing identity
        if: success()
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signing-report.txt
          python - <<'PY_SIGNING'
          import os, re
          from pathlib import Path
          text = Path('signing-report.txt').read_text()
          match = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', text)
          if not match:
              raise SystemExit('APK signing fingerprint missing')
          path = Path(os.path.expanduser('~/.android/clipforge-debug-cert.sha256'))
          fingerprint = match.group(1).lower()
          if path.exists() and path.read_text().strip() != fingerprint:
              raise SystemExit('Cached development signing identity changed')
          path.write_text(fingerprint + '\n')
          print('Development APK signing fingerprint verified')
          PY_SIGNING
      - name: Upload signing report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-signing-report
          path: signing-report.txt
      - name: Verify generated APK
        if: success()
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          ls -lh "$APK"
          echo "### APK verified as a nonempty, valid ZIP archive" >> "$GITHUB_STEP_SUMMARY"
          echo "Path: \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-AI-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  native-smoke:
    name: Native Whisper integration smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache verified public test model
        uses: actions/cache@v4
        with:
          path: .ci-models/ggml-tiny.bin
          key: whisper-tiny-be07e048e1e599ad-v1
      - name: Fetch pinned native source and public speech fixture
        run: git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper.cpp
      - name: Exercise native callbacks and model lifecycle
        shell: bash
        run: |
          set -o pipefail
          bash .github/scripts/native-smoke.sh 2>&1 | tee native-smoke.log
      - name: Upload native integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-native-smoke-log
          path: native-smoke.log
          if-no-files-found: warn

  media-device:
    name: Android decoder and export integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install synthetic fixture generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Prepare test-only signing identity and fixtures
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/clipforge-development.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ClipForge CI Test" -noprompt
          bash .github/scripts/media-fixtures.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real Android media pipeline with synthetic fixtures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedDebugAndroidTest -PmediaDeviceTests=true --no-daemon --console=plain --warning-mode=none
      - name: Upload device integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-android-media-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
