name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: clipforge-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi
      - name: Fetch pinned whisper.cpp native inference source
        run: |
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper.cpp
      - name: Validate source and run available unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --console=plain --warning-mode=none 2>&1 | tee android-test.log
      - name: Build APK with concise diagnostics
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --warning-mode=none 2>&1 | tee android-build.log
      - name: Print actionable errors on failure
        if: failure()
        run: |
          echo '### Android build errors' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          grep -E -A 12 '(^e: |^error:|^FAILURE:|^\* What went wrong:|^Execution failed|Could not resolve|Could not find|Unresolved reference|Compilation error|failed to find)' android-build.log | tail -120 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-build-log
          path: |
            android-build.log
            android-test.log
          if-no-files-found: ignore
      - name: Verify generated APK
        if: success()
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          ls -lh "$APK"
          echo "### APK verified as a nonempty, valid ZIP archive" >> "$GITHUB_STEP_SUMMARY"
          echo "Path: \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-AI-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
